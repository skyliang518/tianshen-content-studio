services:
  workbench:
    image: node:20-alpine
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      SITE_KIND: workbench
      PORT: 4317
      APP_ROOT: /app
    volumes:
      - .:/app:ro
    ports:
      - "4317:4317"
    restart: unless-stopped

  analytics:
    image: node:20-alpine
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      SITE_KIND: analytics
      PORT: 4318
      APP_ROOT: /app
    volumes:
      - .:/app:ro
    ports:
      - "4318:4318"
    restart: unless-stopped
